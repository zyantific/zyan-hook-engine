name: GitHub Actions CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # macos-13 is the x86-64 (Intel) runner; the engine is x86-64 only, so newer arm64 macOS
        # runners cannot execute the hooking tests.
        os: [ubuntu-latest, windows-latest, macos-13]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Configure
        run: cmake -S . -B build -DZYREX_BUILD_TESTS=ON -DZYREX_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
